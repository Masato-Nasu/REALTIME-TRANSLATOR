services:
  - type: web
    name: masato-realtime-translator
    runtime: node
    plan: free
    region: singapore
    branch: pwa-v0.1.1-fixed
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
